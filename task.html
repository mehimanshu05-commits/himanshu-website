<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brand Website</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

<header>

    <h2 class="logo">MyBrand</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<section class="hero">

    <div class="hero-text">
        <h1>Design Your Future</h1>
        <p>Create amazing websites with HTML & CSS</p>
        <button>Start Now</button>
    </div>

</section>

<section id="services" class="services">

    <h2>Our Services</h2>

    <div class="service-box">
        <div class="card">Web Design</div>
        <div class="card">Development</div>
        <div class="card">SEO</div>
    </div>

</section>

<section id="gallery" class="gallery">

    <h2>Gallery</h2>

    <div class="images">
        <img src="mockup.jpg">
        <img src="workshop_image.jpg">
        <img src="programmer_coding.jpg">
        <img src="workshop_image2.jpg">
    </div>

</section>


<section id="contact" class="contact">

    <h2>Contact Us</h2>

    <form>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Message"></textarea>
        <button type="submit">Send</button>
    </form>

</section>

<footer>

    <p>© 2026 MyBrand | All Rights Reserved</p>

</footer>

</body>
</html>
